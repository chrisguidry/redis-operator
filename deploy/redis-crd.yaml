# The Redis resource: one primary and zero or more replicas, of Redis or
# Valkey. plans/01-high-availability.md describes each field, and
# api_redis.go holds the Go types and the defaults.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: redis.redis.guid.foo
spec:
  group: redis.guid.foo
  scope: Namespaced
  names:
    kind: Redis
    listKind: RedisList
    plural: redis
    singular: redis
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Engine
          type: string
          jsonPath: .spec.engine
        - name: Instances
          type: integer
          jsonPath: .spec.instances
        - name: Ready
          type: integer
          jsonPath: .status.readyInstances
        - name: Primary
          type: string
          jsonPath: .status.currentPrimary
        - name: Status
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
        - name: Target
          type: string
          jsonPath: .status.targetPrimary
          priority: 1
        - name: Reason
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].reason
          priority: 1
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              x-kubernetes-validations:
                - rule: "!has(self.minReplicasToWrite) || self.minReplicasToWrite < (has(self.instances) ? self.instances : 1)"
                  message: minReplicasToWrite must be less than instances, or the primary could never accept a write
              properties:
                engine:
                  type: string
                  enum: [redis, valkey]
                  default: redis
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: engine cannot change; one engine's data files are not the other's
                image:
                  type: string
                  description: The server image. The default is the engine's image at the version this operator pins.
                instances:
                  type: integer
                  minimum: 1
                  maximum: 9
                  default: 1
                memory:
                  type: string
                  pattern: '^[1-9][0-9]*(Ki|Mi|Gi|Ti|k|M|G|T)?$'
                  default: 256Mi
                  description: The container's memory limit. maxmemory is 70% of it.
                maxmemoryPolicy:
                  type: string
                  enum: [noeviction, allkeys-lru, allkeys-lfu, allkeys-random, volatile-lru, volatile-lfu, volatile-random, volatile-ttl]
                  default: noeviction
                storage:
                  type: object
                  required: [size]
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: storage cannot change; a StatefulSet's volume claims are fixed when it is made
                  properties:
                    size:
                      type: string
                      pattern: '^[1-9][0-9]*(Ki|Mi|Gi|Ti|k|M|G|T)?$'
                    storageClassName:
                      type: string
                minReplicasToWrite:
                  type: integer
                  minimum: 0
                cpu:
                  type: string
                  description: The CPU request of each instance, such as 100m.
                nodeSelector:
                  type: object
                  additionalProperties:
                    type: string
                tolerations:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                priorityClassName:
                  type: string
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                targetPrimary:
                  type: string
                currentPrimary:
                  type: string
                readyInstances:
                  type: integer
                instances:
                  type: array
                  items:
                    type: object
                    properties:
                      name: {type: string}
                      role: {type: string}
                      ready: {type: boolean}
                      offset: {type: integer}
                switchover:
                  type: object
                  properties:
                    from: {type: string}
                    to: {type: string}
                    reason: {type: string}
                    startedAt: {type: string}
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status, lastTransitionTime]
                    properties:
                      type: {type: string}
                      status: {type: string, enum: ["True", "False", "Unknown"]}
                      observedGeneration: {type: integer}
                      reason: {type: string}
                      message: {type: string}
                      lastTransitionTime: {type: string, format: date-time}
