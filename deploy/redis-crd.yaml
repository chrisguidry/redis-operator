# The Redis resource: one primary and zero or more replicas, of Redis or
# Valkey. plans/01-high-availability.md describes each field, and
# api_redis.go holds the Go types and the defaults.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: redis.redis.guid.foo
spec:
  group: redis.guid.foo
  scope: Namespaced
  names:
    kind: Redis
    listKind: RedisList
    plural: redis
    singular: redis
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Engine
          type: string
          jsonPath: .spec.engine
        - name: Instances
          type: integer
          jsonPath: .spec.instances
        - name: Ready
          type: integer
          jsonPath: .status.readyInstances
        - name: Primary
          type: string
          jsonPath: .status.currentPrimary
        - name: Status
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
        - name: Image
          type: string
          jsonPath: .status.image
          priority: 1
        - name: Target
          type: string
          jsonPath: .status.targetPrimary
          priority: 1
        - name: Reason
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].reason
          priority: 1
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              x-kubernetes-validations:
                - rule: "!has(self.bootstrap) || !has(self.bootstrap.recovery) || !has(self.bootstrap.recovery.key) || has(self.backup)"
                  message: a recovery from a key needs spec.backup to name the store
                - rule: "!has(self.minReplicasToWrite) || self.minReplicasToWrite < (has(self.instances) ? self.instances : 1)"
                  message: minReplicasToWrite must be less than instances, or the primary could never accept a write
              properties:
                engine:
                  type: string
                  enum: [redis, valkey]
                  default: redis
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: engine cannot change; one engine's data files are not the other's
                image:
                  type: string
                  description: The server image. The default is the engine's image at the version this operator pins.
                instances:
                  type: integer
                  minimum: 1
                  maximum: 9
                  default: 1
                memory:
                  type: string
                  pattern: '^[1-9][0-9]*(Ki|Mi|Gi|Ti|k|M|G|T)?$'
                  default: 256Mi
                  description: The container's memory limit. maxmemory is 70% of it.
                maxmemoryPolicy:
                  type: string
                  enum: [noeviction, allkeys-lru, allkeys-lfu, allkeys-random, volatile-lru, volatile-lfu, volatile-random, volatile-ttl]
                  default: noeviction
                storage:
                  type: object
                  required: [size]
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: storage cannot change; a StatefulSet's volume claims are fixed when it is made
                  properties:
                    size:
                      type: string
                      pattern: '^[1-9][0-9]*(Ki|Mi|Gi|Ti|k|M|G|T)?$'
                    storageClassName:
                      type: string
                minReplicasToWrite:
                  type: integer
                  minimum: 0
                cpu:
                  type: string
                  description: The CPU request of each instance, such as 100m.
                nodeSelector:
                  type: object
                  additionalProperties:
                    type: string
                tolerations:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                priorityClassName:
                  type: string
                backup:
                  type: object
                  description: Where this Redis's Backups go, an S3-compatible object store or a volume every instance mounts.
                  x-kubernetes-validations:
                    - rule: has(self.destination) != has(self.volume)
                      message: a backup store is either an object store destination or a volume, not both
                    - rule: "!has(self.destination) || has(self.credentials)"
                      message: an object store destination needs credentials
                  properties:
                    destination:
                      type: string
                      pattern: '^s3://[^/]+(/.*)?$'
                      description: s3://bucket/prefix. Objects land under prefix/namespace/name/.
                    endpoint:
                      type: string
                      description: The store's URL, such as https://s3.example.com. The default is AWS S3 in the region.
                    region:
                      type: string
                      default: us-east-1
                    credentials:
                      type: object
                      required: [secret]
                      properties:
                        secret:
                          type: string
                          description: A Secret in this namespace with the keys ACCESS_KEY_ID and SECRET_ACCESS_KEY.
                    volume:
                      type: object
                      description: A volume every instance mounts at once. Files land under namespace/name/ in it.
                      x-kubernetes-validations:
                        - rule: has(self.claimName) != has(self.nfs)
                          message: a backup volume is either a claim or an NFS export, not both
                      properties:
                        claimName:
                          type: string
                          description: A PersistentVolumeClaim in this namespace. It must be ReadWriteMany.
                        nfs:
                          type: object
                          required: [server, path]
                          properties:
                            server: {type: string}
                            path: {type: string}
                    retention:
                      type: string
                      pattern: '^([1-9][0-9]*d|([0-9]+(\.[0-9]+)?(h|m|s))+)$'
                      description: How long a completed Backup is kept, such as 7d or 36h. The newest is always kept.
                bootstrap:
                  type: object
                  description: How the first primary of a new Redis gets its data. It is read only before any primary has run.
                  properties:
                    recovery:
                      type: object
                      description: Restore a snapshot, from a Backup in this namespace or from a key in spec.backup's store.
                      x-kubernetes-validations:
                        - rule: has(self.backup) != has(self.key)
                          message: recovery names either a backup or a key, not both
                      properties:
                        backup:
                          type: string
                        key:
                          type: string
                replica:
                  type: object
                  description: Replicate from a Redis or Valkey outside the operator, then promote by setting enabled to false.
                  required: [enabled, source]
                  properties:
                    enabled:
                      type: boolean
                    source:
                      type: object
                      x-kubernetes-validations:
                        - rule: has(self.host) != has(self.sentinel)
                          message: a source names either a host or its sentinels, not both
                      properties:
                        host:
                          type: string
                        port:
                          type: integer
                          minimum: 1
                          maximum: 65535
                        password:
                          type: object
                          required: [secret, key]
                          properties:
                            secret: {type: string}
                            key: {type: string}
                        sentinel:
                          type: object
                          required: [masterName, addresses]
                          properties:
                            masterName: {type: string}
                            addresses:
                              type: array
                              minItems: 1
                              items: {type: string}
                            password:
                              type: object
                              required: [secret, key]
                              properties:
                                secret: {type: string}
                                key: {type: string}
                metrics:
                  type: object
                  description: The redis_exporter container beside each instance, which serves its server's metrics on the port named metrics.
                  properties:
                    enabled:
                      type: boolean
                      default: true
                    image:
                      type: string
                      description: The exporter image. The default is redis_exporter at the version this operator pins.
                    checkSingleKeys:
                      type: array
                      description: Keys whose value or length the exporter reports, such as a queue's list. A key is in database 0, or written db<n>=<key>.
                      items:
                        type: string
                        pattern: '^[^,]+$'
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                targetPrimary:
                  type: string
                currentPrimary:
                  type: string
                readyInstances:
                  type: integer
                minReplicasToWrite:
                  type: integer
                instances:
                  type: array
                  items:
                    type: object
                    properties:
                      name: {type: string}
                      role: {type: string}
                      ready: {type: boolean}
                      offset: {type: integer}
                image:
                  type: string
                rollout:
                  type: object
                  properties:
                    image: {type: string}
                    phase: {type: string, enum: [Canary, Rolling, Failed]}
                    canary: {type: string}
                    startedAt: {type: string}
                    reason: {type: string}
                replica:
                  type: object
                  properties:
                    phase: {type: string, enum: [Replicating, Promoting, Promoted]}
                    source: {type: string}
                    sourceOffset: {type: integer}
                    lag: {type: integer}
                switchover:
                  type: object
                  properties:
                    from: {type: string}
                    to: {type: string}
                    reason: {type: string}
                    startedAt: {type: string}
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status, lastTransitionTime]
                    properties:
                      type: {type: string}
                      status: {type: string, enum: ["True", "False", "Unknown"]}
                      observedGeneration: {type: integer}
                      reason: {type: string}
                      message: {type: string}
                      lastTransitionTime: {type: string, format: date-time}
