# A Backup is one snapshot of a Redis, in the object store its
# spec.backup names. plans/completed/02-backups.md describes how one runs, and
# api_backup.go holds the Go types.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: backups.redis.guid.foo
spec:
  group: redis.guid.foo
  scope: Namespaced
  names:
    kind: Backup
    listKind: BackupList
    plural: backups
    singular: backup
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Redis
          type: string
          jsonPath: .spec.redis
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Instance
          type: string
          jsonPath: .status.instance
        - name: Size
          type: integer
          jsonPath: .status.size
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
        - name: Key
          type: string
          jsonPath: .status.key
          priority: 1
        - name: Error
          type: string
          jsonPath: .status.error
          priority: 1
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [redis]
              x-kubernetes-validations:
                - rule: self == oldSelf
                  message: a Backup's spec cannot change
              properties:
                redis:
                  type: string
                  description: The name of a Redis in this namespace.
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [Running, Completed, Failed]
                instance: {type: string}
                key: {type: string}
                size: {type: integer}
                offset: {type: integer}
                startedAt: {type: string}
                completedAt: {type: string}
                error: {type: string}
                store:
                  type: object
                  properties:
                    destination: {type: string}
                    endpoint: {type: string}
                    region: {type: string}
                    retention: {type: string}
                    credentials:
                      type: object
                      properties:
                        secret: {type: string}
                    volume:
                      type: object
                      properties:
                        claimName: {type: string}
                        nfs:
                          type: object
                          properties:
                            server: {type: string}
                            path: {type: string}
