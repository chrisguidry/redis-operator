# The operator's permissions. A Redis can be in any namespace, so these
# are in a ClusterRole. The Lease for leader election is in a Role in
# the operator's namespace.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: redis-operator
rules:
  # patch removes the annotation that forced a failover without its
  # quorum, once the failover it forced named the next primary.
  - apiGroups: [redis.guid.foo]
    resources: [redis]
    verbs: [get, list, watch, patch]
  # A ScheduledBackup makes Backups, retention deletes them, and a
  # finalizer on each deletes its object from the store first.
  - apiGroups: [redis.guid.foo]
    resources: [backups]
    verbs: [get, list, watch, create, delete, patch]
  - apiGroups: [redis.guid.foo]
    resources: [scheduledbackups]
    verbs: [get, list, watch]
  - apiGroups: [redis.guid.foo]
    resources: [backups/status, scheduledbackups/status]
    verbs: [patch]
  # The decision, status.targetPrimary, is written with a merge patch
  # that states the resourceVersion read.
  - apiGroups: [redis.guid.foo]
    resources: [redis/status]
    verbs: [patch]
  # The operator labels each pod with its role, and deletes the pod that
  # rolls next.
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, patch, delete]
  # The primary Lease of each Redis, which its instance managers write.
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [list, watch]
  # A cordoned node starts a switchover off its primary.
  - apiGroups: [""]
    resources: [nodes]
    verbs: [list, watch]
  # The operator posts an Event for each decision on the Redis or the
  # Backup it is about, and patches the count of an Event that repeats.
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  # The children of each Redis are written with server-side apply, which
  # the API server authorizes as a create for an object that does not
  # exist yet.
  - apiGroups: [apps]
    resources: [statefulsets]
    verbs: [list, watch, create, patch]
  - apiGroups: [""]
    resources: [services, serviceaccounts]
    verbs: [create, patch]
  # delete removes the budget on the primary when a Redis scales to one
  # instance.
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [create, patch, delete]
  # The Role a Redis's instance managers run under. Kubernetes lets the
  # operator grant only what it holds, which is everything that Role
  # names.
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings]
    verbs: [create, patch]
  # The connection Secret is created once with its password, and
  # patched when a change to spec.tls changes its addresses. An object
  # store's credentials Secret is read to delete a Backup's object. The
  # operator never lists Secrets, and it grants each Redis's instance
  # managers by name the Secrets they read: its store's, its users'
  # passwords, and its certificate.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create, patch]
  # The Certificate of a Redis whose spec.tls names a cert-manager
  # issuer. Where cert-manager is not installed, this grants nothing.
  - apiGroups: [cert-manager.io]
    resources: [certificates]
    verbs: [create, patch, delete]
  # What the Role for the instance managers grants, which the operator
  # must hold to grant it.
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, create, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: redis-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: redis-operator
# The subject states no namespace. kustomize fills in the namespace of
# the kustomization that takes this base.
subjects:
  - kind: ServiceAccount
    name: redis-operator
---
# The replicas elect a leader through one Lease in the operator's own
# namespace. The operator also reads its own pod, to learn the image it
# runs instance managers from.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: redis-operator
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, create, patch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: redis-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: redis-operator
subjects:
  - kind: ServiceAccount
    name: redis-operator
