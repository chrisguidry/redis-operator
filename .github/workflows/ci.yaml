# Every pull request and every push to main runs the gate: gofmt, vet,
# the race tests, and the coverage floor. release.yaml builds the image
# beside this run and pushes it only when this run passes.
#
# There is no path filter. The tests are cheap, and a filter would have
# to name every file that can break a build.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The gate's three parts run as parallel jobs: the static checks, the
  # race tests, and the coverage floor on its pinned toolchain.
  go:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [lint, test-race, test-coverage]
    steps:
      - uses: actions/checkout@v7

      # setup-go keeps the module downloads and the build cache between
      # runs, keyed on go.sum, so a run compiles only what changed.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # The same targets a workstation runs. The Makefile says why the
      # coverage gate pins a toolchain, and .testcoverage.yml holds the
      # floor.
      - run: make ${{ matrix.target }}

  # A k3s cluster of four nodes in Docker runs the operator built from
  # this checkout against each engine, while a writer confirms every
  # write with WAIT 1, and the chaos scenarios kill, drain, freeze, and
  # roll the Redis. e2e/run.sh says what each scenario proves, and
  # groups them into the shards that run here as parallel jobs, each on
  # its own cluster. ubuntu-26.04 already has Docker and kubectl.
  e2e:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        engine: [redis, valkey]
        shard: [failover, partition, operator, access, backup_volume, rollout, scale, broken]
    steps:
      - uses: actions/checkout@v7
      # The operator's binary is built on the runner, so the build reuses
      # setup-go's cache.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: make e2e
        env:
          ENGINE: ${{ matrix.engine }}
          SHARD: ${{ matrix.shard }}
